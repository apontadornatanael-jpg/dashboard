<!doctype html><html><body><button id="gps">📍 Capturar localização precisa</button><script>
const send=(v)=>window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:setComponentValue',dataType:'json',value:v},'*');
window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:componentReady',apiVersion:1},'*');
window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:52},'*');
document.getElementById('gps').onclick=()=>{
 if(!navigator.geolocation){send({error:{code:0,message:'Este navegador não suporta geolocalização.'}});return;}
 navigator.geolocation.getCurrentPosition(p=>send({latitude:p.coords.latitude,longitude:p.coords.longitude,accuracy:p.coords.accuracy,altitude:p.coords.altitude,timestamp:p.timestamp}),e=>send({error:{code:e.code,message:e.message}}),{enableHighAccuracy:true,timeout:20000,maximumAge:0});
};
</script><style>body{margin:0;background:transparent;font-family:Arial,sans-serif}button{width:100%;height:44px;border:0;border-radius:8px;background:#A8794D;color:white;font-weight:700;font-size:15px;cursor:pointer}button:hover{background:#8D623C}</style></body></html>
